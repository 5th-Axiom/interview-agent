name: interview-agent
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: interview_agent
      POSTGRES_USER: interview_agent
      POSTGRES_PASSWORD: local_interview_only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["interview_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_agent"]
      interval: 3s
      retries: 20
  storage:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: interview_local
      MINIO_ROOT_PASSWORD: interview_local_storage_only
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["interview_objects:/data"]
volumes:
  interview_pg:
  interview_objects:
