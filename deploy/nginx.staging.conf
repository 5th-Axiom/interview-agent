# IP-only test deployment. Existing applications on 443 are left in place.
limit_req_zone $binary_remote_addr zone=interview_access:1m rate=6r/m;
server {
    listen 9443 ssl;
    server_name 47.108.226.96;
    ssl_certificate /etc/interview-agent/letsencrypt/live/interview-agent-ip/fullchain.pem;
    ssl_certificate_key /etc/interview-agent/letsencrypt/live/interview-agent-ip/privkey.pem;
    access_log off;
    client_max_body_size 2m;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options nosniff always;
    location = /api/test-access {
        limit_req zone=interview_access burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:13101;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }
    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
