# ESA terminates browser TLS and redirects HTTP to HTTPS.
# Configure origin HTTP:80 and preserve Host: test.interview.energylt.com.
limit_req_zone $binary_remote_addr zone=interview_access:1m rate=6r/m;
server {
    listen 80;
    server_name test.interview.energylt.com;
    include /etc/nginx/snippets/interview-agent-proxy.conf;
}
# Preserve old bookmarks; this is separate from Aural's IP:443 virtual host.
server {
    listen 9443 ssl;
    server_name 47.108.226.96;
    ssl_certificate /etc/interview-agent/letsencrypt/live/interview-agent-ip/fullchain.pem;
    ssl_certificate_key /etc/interview-agent/letsencrypt/live/interview-agent-ip/privkey.pem;
    access_log off;
    return 308 https://test.interview.energylt.com$request_uri;
}
